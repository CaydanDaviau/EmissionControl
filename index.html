<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EMCON</title>
<style>
:root{
  --bg:#000; --panel:#0c0d0e; --line:#7d8488; --line-dim:#34383b; --text:#d7dadc; --dim:#8d9498;
  --unk:#ffd83a; --act:#045C36;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.25 "Consolas","DejaVu Sans Mono",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;flex-wrap:wrap;gap:2px 14px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line-dim)}
#top>div{white-space:nowrap}
#top b{color:var(--dim);font-weight:normal}
#top .st{color:#fff;font-weight:bold}
#main{flex:1;display:flex;min-height:0;position:relative}
.arrow{position:absolute;top:8px;left:8px;z-index:5;width:44px;height:44px;background:rgba(22,25,27,.85);color:var(--text);font-size:22px;padding:0;min-width:0}
#nextSt{left:58px}
#menuB{left:108px;font-size:20px}
#pages{flex:1;min-width:0;display:flex;min-height:0}
.page{flex:1;display:none;min-height:0;min-width:0}
.page.active{display:flex}
#navPage{flex-direction:row}
#sensPage{flex:1;overflow-y:auto;touch-action:pan-y;background:var(--panel);padding-top:60px;max-width:560px}
.note{color:var(--dim);font-size:12px;line-height:1.4;margin-top:6px}
.srow{display:flex;gap:10px;padding:5px 0}.srow .n{min-width:52px;color:var(--dim)}.srow .s{margin-left:auto}
.bar{height:6px;background:#1a1d1f;border:1px solid var(--line-dim);margin:8px 0 2px}
.bar i{display:block;height:100%;width:0;background:#3fbf8a}
#idList{max-height:150px;overflow-y:auto;touch-action:pan-y;margin-bottom:6px;border:1px solid var(--line-dim)}
.idr{display:flex;gap:12px;padding:7px 6px}.idr .s{margin-left:auto;color:var(--dim)}.idr.sel{background:#2a2f33}.idr.lost{opacity:.45}
.idr.unk span:first-child{color:var(--unk)}.idr.ally span:first-child{color:#4da3ff}.idr.host span:first-child{color:#ff4a4a}
.esmr{padding:5px 0;color:#b388ff}.esmr .d{color:var(--dim);font-size:12px}
#scopeWrap{flex:1;position:relative;min-width:0;min-height:180px}
canvas{position:absolute;inset:0;width:100%;height:100%}
#side{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line-dim);overflow-y:auto;touch-action:pan-y}
.ph{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:16px;line-height:1.8}
.sec{padding:8px;border-bottom:1px solid var(--line-dim)}
.sec h5{margin:0 0 6px;font-weight:normal;color:var(--dim);letter-spacing:1px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.row:last-child{margin-bottom:0}
.row .lbl{color:var(--dim);min-width:54px}
.row .rd{margin-left:auto;color:var(--text)}
button{font:inherit;color:var(--text);background:#16191b;border:1px solid var(--line);padding:9px 10px;min-width:40px}
button:active{background:var(--act)}
button.on{background:var(--act);border-color:#3fbf8a;color:#fff}
button.off{color:var(--dim);border-color:var(--line-dim)}
.spd button{flex:1;padding:10px 2px;font-size:12px}
input{font:inherit;color:#fff;background:#000;border:1px solid var(--line);padding:9px 4px;width:70px;text-align:center;font-size:16px;user-select:text;-webkit-user-select:text}
.hdg button{width:54px;font-size:18px;padding:8px 0}
.val{min-width:64px;text-align:center}
#tHead{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-dim);background:var(--panel);padding:10px 8px}
#tList{display:none;max-height:190px;overflow:auto;touch-action:pan-y;border-bottom:1px solid var(--line-dim)}
#tList.open{display:block}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-weight:normal;text-align:right;padding:3px 6px;position:sticky;top:0;background:var(--panel)}
td{text-align:right;padding:5px 6px}
th:first-child,td:first-child{text-align:left}
tr.unk td:first-child{color:var(--unk)}
tr.ally td:first-child{color:#4da3ff}
tr.host td:first-child{color:#ff4a4a}
tr.lost{opacity:.45}
.tags button{flex:1;padding:10px 2px;font-size:12px}
button:disabled{opacity:.35}
#selInfo{color:var(--dim);margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ov.show{display:flex}
.ov h1{margin:0 0 10px;letter-spacing:4px;font-weight:normal}
.ov button{width:220px;padding:14px}
tr.sel{background:#2a2f33}
@media (max-width:760px){
  #navPage{flex-direction:column}
  #side{width:auto;border-left:0;border-top:1px solid var(--line-dim);max-height:54%;flex:none}
  #top{font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="st" id="stName">NAVIGATION</div>
    <div><b>POS</b> <span id="pos"></span></div>
    <div class="hide-s"><b>UTC</b> <span id="utc"></span></div>
    <div><b>CRS</b> <span id="crs">000°</span></div>
    <div><b>SPD</b> <span id="spdT">0.0</span> KT</div>
  </div>
  <div id="main">
    <button class="arrow" id="prevSt">&lsaquo;</button>
    <div id="pages">
      <div class="page active" id="pg0">
        <div id="navPage" style="display:flex;flex:1;min-width:0;min-height:0">
          <div id="scopeWrap"><canvas id="cv"></canvas></div>
          <div id="side">
            <button id="tHead">TRACKS: <span id="tcount">0</span> ▾</button>
            <div id="tList"><table>
              <thead><tr><th>TRK</th><th>TAG</th><th>BRG</th><th>RNG</th></tr></thead>
              <tbody id="tbody"></tbody></table></div>

            <div class="sec">
              <h5>CONTACT</h5>
              <div id="selInfo">No contact selected</div>
              <div class="row tags"><button data-t="unk">UNKNOWN</button><button data-t="ally">ALLY</button><button data-t="host">HOSTILE</button></div>
            </div>

            <div class="sec">
              <h5>SPEED</h5>
              <div class="row spd">
                <button id="sRev">REVERSE</button>
                <button id="sStop">STOP</button>
                <button id="sCru">CRUISE 15</button>
                <button id="sFlk">FLANK 30</button>
              </div>
              <div class="row"><span class="lbl">SPD</span><span class="rd"><span id="spdA">0.0</span> kt &rarr; <span id="spdO">0</span></span></div>
            </div>

            <div class="sec">
              <h5>HEADING</h5>
              <div class="row hdg">
                <button id="hL">&lt;</button>
                <input id="hdgIn" type="text" inputmode="numeric" enterkeyhint="go" maxlength="3" value="000" autocomplete="off">
                <button id="hR">&gt;</button>
                <span class="rd"><span id="hdgA">000</span>° &rarr; <span id="hdgO">000</span>°</span>
              </div>
              <div class="row"><button id="orient" style="flex:1">NORTH UP</button></div>
            </div>

            <div class="sec">
              <h5>DISPLAY</h5>
              <div class="row">
                <span class="lbl">Range</span><button id="rm">-</button><span class="val" id="rv"></span><button id="rp">+</button>
              </div>
              <div class="row">
                <span class="lbl">Rings</span><button id="ringsB">On</button>
                <span class="lbl" style="min-width:0">Labels</span><button id="labB">On</button>
                <span class="lbl" style="min-width:0">Grid</span><button id="gridB">On</button>
              </div>
              <div class="row"><span class="lbl">Time</span><button id="tsB">1x</button></div>
            </div>
          </div>
        </div>
      </div>
      <div class="page" id="pg1">
        <div id="sensPage">
          <div class="sec">
            <h5>EMCON</h5>
            <div class="row"><button id="emconB" style="flex:1"></button></div>
            <div class="note" id="emNote"></div>
          </div>
          <div class="sec">
            <h5>IDENTIFY</h5>
            <div id="idList"></div>
            <div id="idInfo" class="note" style="margin:0 0 6px">No contact selected</div>
            <div class="row"><button id="idB" style="flex:1">IDENTIFY</button></div>
            <div class="bar"><i id="idBar"></i></div>
            <div class="note" id="idNote"></div>
          </div>
          <div class="sec"><h5>SENSORS</h5><div id="sensList"></div></div>
          <div class="sec"><h5>ESM CONTACTS</h5><div id="esmList"></div></div>
        </div>
      </div>
    </div>
    <button class="arrow" id="nextSt">&rsaquo;</button>
    <button class="arrow" id="menuB">&#9776;</button>
  </div>
</div>
<div class="ov show" id="menu"><h1>EMCON</h1><button id="startB">START</button><button id="setB">&#9881; SETTINGS</button></div>
<div class="ov" id="settings"><h1>SETTINGS</h1><div class="row"><span class="lbl">Radar sweep</span><button id="sweepB" style="width:100px">On</button></div><button id="backB">BACK</button></div>
<script src="sim.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const pad3=n=>String(Math.round(n)).padStart(3,"0");

// ---- stations (tabs) ----
const STATIONS=["NAVIGATION","SENSORS","WEAPONS","DEFENSE"];
let stIdx=0;
STATIONS.forEach((n,i)=>{ if(i<=1) return;
  const d=document.createElement("div"); d.className="page"; d.id="pg"+i;
  d.innerHTML='<div class="ph">'+n+'<br>not built yet</div>'; $("pages").appendChild(d); });
function showStation(i){
  stIdx=(i+STATIONS.length)%STATIONS.length;
  STATIONS.forEach((_,k)=>$("pg"+k).classList.toggle("active",k===stIdx));
  $("stName").textContent=STATIONS[stIdx]; resize();
}
$("prevSt").onclick=()=>showStation(stIdx-1);
$("nextSt").onclick=()=>showStation(stIdx+1);

// ---- state ----
const RANGES=[5,10,20,40,70,100,150,200,300];
const TS=[1,5,20];
const ship=Sim.newShip();
const LAT0=41+11.295/60, LON0=21+26.496/60;
const contacts=[ [1,143,28.7],[2,255,32.1],[3,260,0.9],[4,243,154],[5,197,65.8],
  [6,199,216],[7,351,214],[8,17,32,{rcs:800,h:400,side:"enemy"}],[9,88,44.0],[10,312,8.2,{side:"enemy"}],[11,120,15,{side:"ally"}],
  [12,40,45,{side:"enemy",course:230,speed:15,emit:{name:"Type 346B",range:35}}] // moving emitter: heard by ESM before radar sees it
].map(([id,b,r,o])=>Sim.newContact(id,b,r,o));
const radar=Sim.newRadar(20261111), esm=Sim.newEsm(20261112);
let sweepOn=true; try{ sweepOn=localStorage.getItem("emcon.sweep")!=="0"; }catch(e){}
const S={paused:true,ri:4,rings:true,labels:true,grid:true,sel:null,hup:false,ts:0};
const COL={own:"#fff",ally:"#4da3ff",unk:"#ffd83a",host:"#ff4a4a"};

const cv=$("cv"),g=cv.getContext("2d");
let W=0,H=0,dpr=1;
function resize(){
  dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
}
new ResizeObserver(resize).observe($("scopeWrap"));

function niceStep(range){ const t=range/4, p=Math.pow(10,Math.floor(Math.log10(t))), m=t/p;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
const rng=c=>Math.hypot(c.px-ship.x,c.py-ship.y);
const brg=c=>Sim.norm(Math.atan2(c.px-ship.x,c.py-ship.y)*180/Math.PI);
function scopeGeom(){ return {cx:W/2,cy:H/2,R:Math.min(W,H)/2-26}; }
function proj(c,G,px,rot){ // contact -> screen
  const dx=c.px-ship.x, dy=c.py-ship.y, r=Math.hypot(dx,dy), b=Math.atan2(dx,dy)-rot*Math.PI/180;
  return {x:G.cx+Math.sin(b)*r*px, y:G.cy-Math.cos(b)*r*px};
}

function draw(){
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const G=scopeGeom(), cx=G.cx, cy=G.cy, R=G.R; if(R<40) return;
  const range=RANGES[S.ri], px=R/range, rot=S.hup?ship.hdg:0;
  const A=b=>(b-rot-90)*Math.PI/180; // true bearing -> canvas angle

  g.strokeStyle="#7d8488"; g.lineWidth=1; g.beginPath(); g.arc(cx,cy,R,0,Math.PI*2); g.stroke();
  g.fillStyle="#9aa1a5"; g.font="11px monospace"; g.textAlign="center"; g.textBaseline="middle";
  for(let d=0;d<360;d+=5){
    const a=A(d), l=d%10===0?9:5;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); g.lineTo(cx+Math.cos(a)*(R-l),cy+Math.sin(a)*(R-l)); g.stroke();
    if(d%30===0) g.fillText(String(d),cx+Math.cos(a)*(R+15),cy+Math.sin(a)*(R+15));
  }
  if(S.grid){ g.strokeStyle="#34383b";
    for(let d=0;d<360;d+=30){ const a=A(d); g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); g.stroke(); } }
  if(S.rings){
    const st=niceStep(range); g.strokeStyle="#34383b"; g.fillStyle="#8d9498"; g.textAlign="left";
    for(let r=st;r<range-st*0.05;r+=st){ g.beginPath(); g.arc(cx,cy,r*px,0,Math.PI*2); g.stroke();
      g.fillText(r%1?r.toFixed(1):r,cx+4,cy-r*px-6); }
  }
  // heading arrow on the ring
  { const a=A(ship.hdg), ux=Math.cos(a), uy=Math.sin(a), tx=-uy, ty=ux;
    g.fillStyle="#fff"; g.beginPath();
    g.moveTo(cx+ux*(R+5),cy+uy*(R+5));
    g.lineTo(cx+ux*(R-9)+tx*6,cy+uy*(R-9)+ty*6);
    g.lineTo(cx+ux*(R-9)-tx*6,cy+uy*(R-9)-ty*6);
    g.closePath(); g.fill(); }
  // ordered heading marker (grey, points inward)
  { const a=A(ship.ordHdg), ux=Math.cos(a), uy=Math.sin(a), tx=-uy, ty=ux;
    g.fillStyle="#6b7378"; g.beginPath();
    g.moveTo(cx+ux*(R-8),cy+uy*(R-8));
    g.lineTo(cx+ux*(R+5)+tx*5,cy+uy*(R+5)+ty*5);
    g.lineTo(cx+ux*(R+5)-tx*5,cy+uy*(R+5)-ty*5);
    g.closePath(); g.fill(); }
  // radar max range (dashed) + sweep
  { const rr=Sim.CFG.RADAR.RANGE*px;
    if(rr<R-4){ g.save(); g.setLineDash([4,5]); g.strokeStyle="#4b5256"; g.beginPath(); g.arc(cx,cy,rr,0,Math.PI*2); g.stroke(); g.restore(); }
    if(sweepOn&&radar.on){ const L=Math.min(rr,R); g.save(); g.lineWidth=1.5;
      for(let k=0;k<22;k++){ const a=A(radar.ang-k*2); g.strokeStyle="rgba(63,191,138,"+(0.55*(1-k/22)).toFixed(3)+")";
        g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*L,cy+Math.sin(a)*L); g.stroke(); }
      g.restore(); } }
  // ESM bearing lines (dashed violet, +/- sigma wedge)
  for(const c of contacts){ if(!c.esm) continue;
    const a=A(c.esm.brg), sg=Sim.CFG.ESM.SIGMA*Math.PI/180, f=Math.max(0.35,1-0.65*(esm.t-c.esm.t)/Sim.CFG.ESM.HOLD);
    g.save(); g.globalAlpha=f; g.fillStyle="rgba(179,136,255,.12)"; g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R,a-sg,a+sg); g.closePath(); g.fill();
    g.strokeStyle="#b388ff"; g.lineWidth=1.2; g.setLineDash([7,5]); g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); g.stroke(); g.setLineDash([]);
    if(S.labels){ g.fillStyle="#b388ff"; g.textAlign="left"; g.textBaseline="middle"; g.fillText("E"+c.esmNo+" "+c.emit.name,cx+Math.cos(a)*R*0.62+6,cy+Math.sin(a)*R*0.62); }
    g.restore(); }
  // contacts (only what the radar has seen)
  g.lineWidth=1.6;
  for(const c of contacts){
    if(!c.seen||rng(c)>range) continue;
    const p=proj(c,G,px,rot); g.save(); g.translate(p.x,p.y);
    let al=1; if(!c.tracked) al=0.3; else al=1-0.65*Math.min(1,(radar.t-c.lastHit)/Sim.CFG.RADAR.PERIOD);
    g.globalAlpha=al; g.strokeStyle=COL[c.cls];
    if(!c.tracked) g.setLineDash([3,3]);
    if(c.cls==="ally"){ g.beginPath(); g.arc(0,0,5.5,0,Math.PI*2); g.stroke(); } else g.strokeRect(-5,-5,10,10);
    g.setLineDash([]); g.globalAlpha=1;
    if(S.sel===c.id){ g.strokeStyle="#fff"; g.lineWidth=1; g.strokeRect(-9,-9,18,18); g.lineWidth=1.6; }
    if(S.labels){ g.globalAlpha=Math.max(al,0.3); g.fillStyle=COL[c.cls]; g.textAlign="left"; g.textBaseline="middle"; g.fillText(String(c.id).padStart(4,"0"),11,0); }
    g.restore();
  }
  // own ship: white square + short heading line
  { const a=A(ship.hdg); g.strokeStyle="#fff"; g.lineWidth=1.6;
    g.strokeRect(cx-5,cy-5,10,10);
    g.beginPath(); g.moveTo(cx+Math.cos(a)*5,cy+Math.sin(a)*5); g.lineTo(cx+Math.cos(a)*20,cy+Math.sin(a)*20); g.stroke(); }
}

// ---- HUD / text ----
function fmtPos(deg,p,n,w){ const a=Math.abs(deg), d=Math.floor(a), m=(a-d)*60;
  return String(d).padStart(w,"0")+"°"+m.toFixed(3).padStart(6,"0")+"'"+(deg>=0?p:n); }
function hud(){
  const lat=LAT0+ship.y/60, lon=LON0+ship.x/(60*Math.cos(lat*Math.PI/180));
  $("pos").textContent=fmtPos(lat,"N","S",2)+" "+fmtPos(lon,"E","W",3);
  $("utc").textContent=new Date().toISOString().slice(0,19).replace("T"," ");
  $("crs").textContent=pad3(ship.hdg)+"°";
  $("spdT").textContent=ship.spd.toFixed(1);
  $("spdA").textContent=ship.spd.toFixed(1); $("spdO").textContent=ship.ordSpd;
  $("hdgA").textContent=pad3(ship.hdg); $("hdgO").textContent=pad3(ship.ordHdg);
  for(const [id,v] of [["sRev",Sim.CFG.REVERSE],["sStop",0],["sCru",Sim.CFG.CRUISE],["sFlk",Sim.CFG.FLANK]])
    $(id).classList.toggle("on",ship.ordSpd===v);
}
function ui(){
  $("rv").textContent=RANGES[S.ri]+" NM";
  $("ringsB").textContent=S.rings?"On · "+niceStep(RANGES[S.ri]):"Off"; $("ringsB").classList.toggle("off",!S.rings);
  $("labB").textContent=S.labels?"On":"Off"; $("labB").classList.toggle("off",!S.labels);
  $("gridB").textContent=S.grid?"On":"Off"; $("gridB").classList.toggle("off",!S.grid);
  $("orient").textContent=S.hup?"HEADING UP":"NORTH UP";
  $("tsB").textContent=TS[S.ts]+"x";
  fillTable();
}
const SENSORS=[ // add new sensors here; each row shows name, model and live state
  {name:"RADAR",model:"AN/SPY-1D",state:()=>radar.on?"EMITTING":"SILENT"},
  {name:"ESM",model:"AN/SLQ-32",state:()=>"PASSIVE"} ];
function sensUi(){
  const eb=$("emconB"); eb.textContent=radar.on?"EMCON OFF  \u00b7  RADAR EMITTING":"EMCON ON  \u00b7  RADAR SILENT"; eb.classList.toggle("on",!radar.on);
  $("emNote").textContent=radar.on?"Radar on: you can track radar contacts, but enemy ESM can hear you from beyond your radar horizon."
    :"Radar off: enemy ESM cannot hear you, but you are blind to radar contacts and existing tracks fade out.";
  $("sensList").innerHTML=SENSORS.map(x=>`<div class="srow"><span class="n">${x.name}</span><span>${x.model}</span><span class="s">${x.state()}</span></div>`).join("");
  const L=contacts.filter(c=>c.esm).sort((a,b)=>a.esmNo-b.esmNo);
  identList();
  $("esmList").innerHTML=L.length?L.map(c=>{
    const near=c.seen&&c.tracked&&Math.abs(Sim.diff(brg(c),c.esm.brg))<2*Sim.CFG.ESM.SIGMA;
    return `<div class="esmr">E${c.esmNo}  ${c.emit.name}  BRG ${pad3(c.esm.brg)}\u00b1${Sim.CFG.ESM.SIGMA}${near?"  = TRK "+String(c.id).padStart(4,"0"):""}<div class="d">heard ${Math.round(esm.t-c.esm.t)}s ago</div></div>`;
  }).join(""):'<div class="note">No emitters heard.</div>';
}
$("emconB").onclick=()=>{ radar.on=!radar.on; sensUi(); };
// ---- identify (SENSORS tab) ----
const IDN={unk:"NEUTRAL",ally:"ALLY",host:"HOSTILE"};
let idHtml="";
function identList(){
  const L=contacts.filter(c=>c.seen).sort((a,b)=>a.id-b.id);
  const h=L.map(c=>{ const st=!c.tracked?"LOST":c.identified?"IDENTIFIED":c.idActive?Math.round(100*c.idProg/Sim.CFG.IDENTIFY.TIME)+"%":"";
    return `<div class="idr ${c.cls}${c.tracked?"":" lost"}${S.sel===c.id?" sel":""}" data-id="${c.id}"><span>${String(c.id).padStart(4,"0")}</span><span>${c.tracked?TAGN[c.cls]:"--"}</span><span>${rng(c).toFixed(1)} NM</span><span class="s">${st}</span></div>`; }).join("")
    ||'<div class="note" style="padding:6px">No contacts yet.</div>';
  if(h!==idHtml){ idHtml=h; $("idList").innerHTML=h; }
}
function identPanel(){
  const c=contacts.find(k=>k.id===S.sel&&k.seen), T=Sim.CFG.IDENTIFY.TIME, b=$("idB");
  $("idInfo").textContent=c?String(c.id).padStart(4,"0")+"  BRG "+pad3(brg(c))+"  RNG "+rng(c).toFixed(1)+"  "+(c.tracked?"Q "+Math.round(c.q*100)+"%":"LOST"):"No contact selected";
  b.textContent=!c?"IDENTIFY":c.idActive?"CANCEL":c.identified?"IDENTIFIED":"IDENTIFY";
  b.disabled=!c||(!c.idActive&&(c.identified||!c.tracked||!radar.on)); b.classList.toggle("on",!!c&&c.idActive);
  $("idBar").style.width=(c?(c.identified?100:100*c.idProg/T):0)+"%";
  $("idNote").textContent=!c?"Pick a contact from the list.":c.identified?"Identified: "+IDN[c.cls]+". Tag is locked.":
    c.idActive?"Identifying... "+Math.floor(c.idProg)+" / "+T+" s. Keep the radar track.":
    c.idNote==="lost"?"Interrupted: track lost. Progress reset.":c.idNote==="emcon"?"Interrupted: radar went silent (EMCON). Progress reset.":!radar.on?"Radar is silent (EMCON). Identify needs the radar on.":!c.tracked?"Track lost. Identify needs a radar track.":
    "Needs a continuous radar track for "+T+" s. Losing it resets progress.";
}
$("idList").addEventListener("pointerdown",e=>{ const r=e.target.closest(".idr"); if(!r) return;
  const id=+r.dataset.id; S.sel=S.sel===id?null:id; identList(); identPanel(); fillTable(); });
$("idB").onclick=()=>{ const c=contacts.find(k=>k.id===S.sel&&k.seen); if(!c) return;
  if(c.idActive) Sim.cancelIdentify(c); else Sim.startIdentify(c); identPanel(); identList(); };
const TAGN={unk:"UNK",ally:"ALLY",host:"HOST"};
function fillTable(){
  const range=RANGES[S.ri], list=contacts.filter(c=>c.seen&&rng(c)<=range).sort((a,b)=>a.id-b.id);
  $("tcount").textContent=list.filter(c=>c.tracked).length;
  selPanel();
  if(!$("tList").classList.contains("open")) return;
  const tb=$("tbody"); tb.innerHTML="";
  for(const c of list){
    const tr=document.createElement("tr"); tr.className=c.cls+(c.tracked?"":" lost")+(S.sel===c.id?" sel":"");
    tr.innerHTML=`<td>${String(c.id).padStart(4,"0")}</td><td>${c.tracked?TAGN[c.cls]:"LOST"}</td><td>${pad3(brg(c))}</td><td>${rng(c).toFixed(1)}</td>`;
    tr.onclick=()=>{S.sel=S.sel===c.id?null:c.id; fillTable();};
    tb.appendChild(tr);
  }
}
function selPanel(){
  const c=contacts.find(k=>k.id===S.sel&&k.seen);
  $("selInfo").textContent=c?String(c.id).padStart(4,"0")+"  BRG "+pad3(brg(c))+"  RNG "+rng(c).toFixed(1)+"  "+(c.tracked?"Q "+Math.round(c.q*100)+"%":"LOST")+(c.identified?"  ID":""):"No contact selected";
  document.querySelectorAll(".tags button").forEach(b=>{ b.disabled=!(c&&c.tracked&&!c.identified); b.classList.toggle("on",!!c&&c.tracked&&c.cls===b.dataset.t); });
}
document.querySelectorAll(".tags button").forEach(b=>b.onclick=()=>{
  const c=contacts.find(k=>k.id===S.sel); if(c&&Sim.setTag(c,b.dataset.t)) fillTable(); });

// ---- controls ----
$("tHead").onclick=()=>{ $("tList").classList.toggle("open"); fillTable(); };
$("sRev").onclick=()=>ship.ordSpd=Sim.CFG.REVERSE;
$("sStop").onclick=()=>ship.ordSpd=0;
$("sCru").onclick=()=>ship.ordSpd=Sim.CFG.CRUISE;
$("sFlk").onclick=()=>ship.ordSpd=Sim.CFG.FLANK;

function setOrdHdg(v){ ship.ordHdg=Sim.norm(v); $("hdgIn").value=pad3(ship.ordHdg); }
function holdBtn(el,fn){
  let t=0,i=0; const stop=()=>{clearTimeout(t);clearInterval(i);};
  el.addEventListener("pointerdown",e=>{ e.preventDefault(); stop(); fn(); t=setTimeout(()=>{i=setInterval(fn,60);},400); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
holdBtn($("hL"),()=>setOrdHdg(ship.ordHdg-1));
holdBtn($("hR"),()=>setOrdHdg(ship.ordHdg+1));
const hin=$("hdgIn");
function commitHdg(){ const v=parseInt(hin.value,10); if(!isNaN(v)) ship.ordHdg=Sim.norm(v); hin.value=pad3(ship.ordHdg); }
hin.addEventListener("focus",()=>hin.select());
hin.addEventListener("input",()=>{ hin.value=hin.value.replace(/\D/g,""); if(hin.value.length===3){ commitHdg(); hin.blur(); } });
hin.addEventListener("keydown",e=>{ if(e.key==="Enter"){ commitHdg(); hin.blur(); } });
hin.addEventListener("blur",commitHdg);

$("orient").onclick=()=>{S.hup=!S.hup;ui();};
$("rm").onclick=()=>{S.ri=Math.max(0,S.ri-1);ui();};
$("rp").onclick=()=>{S.ri=Math.min(RANGES.length-1,S.ri+1);ui();};
$("ringsB").onclick=()=>{S.rings=!S.rings;ui();};
$("labB").onclick=()=>{S.labels=!S.labels;ui();};
$("gridB").onclick=()=>{S.grid=!S.grid;ui();};
$("tsB").onclick=()=>{S.ts=(S.ts+1)%TS.length;ui();};

cv.addEventListener("pointerdown",e=>{
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const G=scopeGeom(), range=RANGES[S.ri], px=G.R/range, rot=S.hup?ship.hdg:0;
  let best=null,bd=22;
  for(const c of contacts){ if(!c.seen||rng(c)>range) continue; const p=proj(c,G,px,rot), d=Math.hypot(p.x-mx,p.y-my); if(d<bd){bd=d;best=c;} }
  S.sel=best?best.id:null; fillTable();
});

// ---- menu / settings ----
function showMenu(on){ S.paused=on; $("menu").classList.toggle("show",on); }
function sweepUi(){ $("sweepB").textContent=sweepOn?"On":"Off"; $("sweepB").classList.toggle("off",!sweepOn); }
$("startB").onclick=()=>{ $("startB").textContent="RESUME"; showMenu(false); };
$("menuB").onclick=()=>showMenu(true);
$("setB").onclick=()=>{ $("menu").classList.remove("show"); $("settings").classList.add("show"); };
$("backB").onclick=()=>{ $("settings").classList.remove("show"); $("menu").classList.add("show"); };
$("sweepB").onclick=()=>{ sweepOn=!sweepOn; try{localStorage.setItem("emcon.sweep",sweepOn?"1":"0");}catch(e){} sweepUi(); };
sweepUi();

// ---- loop ----
let last=performance.now();
function frame(t){
  const rdt=Math.min(0.1,(t-last)/1000); last=t; let sdt=rdt*TS[S.ts]; // rdt = real time (radar), sdt = scaled (ship motion)
  if(!S.paused){ while(sdt>0){ const h=Math.min(0.5,sdt); Sim.step(ship,h); for(const c of contacts) Sim.stepContact(c,h); sdt-=h; }
    Sim.radarStep(radar,ship,contacts,rdt); Sim.esmStep(esm,ship,contacts,rdt); Sim.identifyStep(contacts,rdt,radar.on); } // sensors run in real time
  hud(); draw(); if(stIdx===1) identPanel(); requestAnimationFrame(frame);
}
setInterval(()=>{fillTable();sensUi();},500);
resize(); ui(); sensUi(); identPanel(); requestAnimationFrame(frame);
</script>
</body>
</html>
