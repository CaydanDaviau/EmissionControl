name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'sim.js', 'net.js', 'lobby.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode keystore (if the secret exists)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/emc.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/emc.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK (no keystore secret set)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          f=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$f" out/EMCON.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EMCON-apk
          path: out/EMCON.apk

      - name: Rolling release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/EMCON.apk --prerelease --title "EMCON (latest build)" --notes "Automatic build of ${GITHUB_SHA::7}"
